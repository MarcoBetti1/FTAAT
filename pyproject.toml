[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextfrontier"
version = "0.1.0"
description = "Reproducible context stress tests from FTAAT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "python-dotenv>=1.2.2,<2", "tiktoken>=0.9,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jinja2>=3.1,<4"]
video = ["pillow>=12.3,<13", "numpy>=2,<3", "matplotlib>=3.9,<4"]
legacy = ["openai>=1.77", "python-dotenv>=1", "jinja2>=3.1", "pandas>=2", "streamlit>=1.54", "sqlalchemy>=2", "plotly>=6"]

[project.scripts]
contextfrontier = "contextfrontier.cli:main"

[tool.setuptools.packages.find]
include = ["contextfrontier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
